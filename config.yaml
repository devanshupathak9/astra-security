# Everything app- or model-specific lives here, never in code.

app:
  path: apks/InsecureShop.apk                 # an .apk, or an already-decompiled folder
  groundtruth: groundtruth/insecureshop.yaml  # optional; if missing, teacher findings are used as labels

tools:
  jadx: tools/bin/jadx            # installed by setup.sh; falls back to `jadx` on PATH

ingest:
  # App code = classes under the manifest package. Extra app packages can be added here.
  extra_app_prefixes: []
  # Android / Kotlin platform code: never app code, and not listed as libraries
  # (their versions come from META-INF/*.version instead)
  platform_prefixes: [android, androidx, kotlin, kotlinx, java, javax]
  # Android build-generated files: never contain app logic
  skip_files: ["*/R.java", "*/R$*.java", "*/BR.java", "*/databinding/*", "*/DataBinderMapperImpl.java", "*/DataBindingInfo.java"]
  # Decompiler noise: lines matching these regexes are blanked (Kotlin metadata, null checks)
  noise_lines: ['^\s*@Metadata\(', '^\s*Intrinsics\.check\w*\(', '^\s*/\* JADX INFO']
  # Resource files worth scanning (glob, relative to the decompiled folder)
  resource_globs: ["**/res/xml/*.xml", "**/res/values/strings.xml", "**/assets/*.json", "**/assets/*.properties"]

models:
  # Adding a model = adding an entry here. Any OpenAI-compatible API works via base_url.
  teacher:
    model: gpt-4o-mini            # set to a model your OpenAI key can use
    api_key_env: OPENAI_API_KEY
    base_url: null                # null = api.openai.com
    temperature: 0.0
    max_chunk_chars: 20000        # how much code goes into one request
  student:
    model: llama-3.1-8b-instant   # any open model on Groq
    api_key_env: GROQ_API_KEY
    base_url: https://api.groq.com/openai/v1
    temperature: 0.0
    max_chunk_chars: 12000        # small models / free tiers have small context and rate limits

scan:
  # How code is passed to the model:
  #   packed   - files packed together up to max_chunk_chars
  #   per_file - one file per request
  #   slices   - one request per manifest component: its file + app files it references
  strategy: slices
  slice_depth: 2                  # how many reference hops to follow from each component
  drop_unverified: true           # drop findings whose evidence quote isn't in the code

loop:
  student_runs: 3                 # repeat each student scan to measure variance
  max_lessons: 12

output_dir: runs

# Shared vocabulary for findings and ground truth. Matching is done on these keys.
categories:
  - hardcoded_secret
  - webview_untrusted_url
  - webview_insecure_settings
  - ssl_validation_bypass
  - intent_redirection
  - exported_component
  - implicit_intent
  - insecure_broadcast_receiver
  - content_provider_exposure
  - fileprovider_misconfig
  - arbitrary_file_theft
  - insecure_set_result
  - insecure_data_storage
  - insecure_logging
  - code_execution
  - vulnerable_dependency
  - cloud_misconfiguration
  - other
