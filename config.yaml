# Everything app- or model-specific lives here, never in code.

app:
  path: apks/InsecureShop.apk                 # an .apk, or an already-decompiled folder
  groundtruth: groundtruth/insecureshop.yaml  # optional; if missing, teacher findings are used as labels

tools:
  jadx: tools/bin/jadx            # installed by setup.sh; falls back to `jadx` on PATH

ingest:
  # App code = classes under the manifest package. Extra app packages can be added here.
  extra_app_prefixes: []
  # Android / Kotlin platform code: never app code, and not listed as libraries
  # (their versions come from META-INF/*.version instead)
  platform_prefixes: [android, androidx, kotlin, kotlinx, java, javax]
  # Android build-generated files: never contain app logic
  skip_files: ["*/R.java", "*/R$*.java", "*/BR.java", "*/databinding/*", "*/DataBinderMapperImpl.java", "*/DataBindingInfo.java"]
  # Decompiler noise: lines matching these regexes are blanked (Kotlin metadata, null checks)
  noise_lines: ['^\s*@Metadata\(', '^\s*Intrinsics\.check\w*\(', '^\s*/\* JADX INFO']
  # Resource files worth scanning (glob, relative to the decompiled folder)
  resource_globs: ["**/res/xml/*.xml", "**/res/values/strings.xml", "**/assets/*.json", "**/assets/*.properties"]

models:
  # Model ids, keys and endpoints come from .env (see .env.example), so switching
  # models or providers never needs a code change.   ${VAR:-default} = env var, with a default.
  #
  #   provider: openai     -> any OpenAI-compatible API (OpenAI, Groq, Together, Ollama, vLLM)
  #   provider: anthropic  -> Claude via Anthropic's SDK
  #   base_url             -> empty = api.openai.com; Groq = https://api.groq.com/openai/v1
  #   temperature          -> empty = the model's default (newer OpenAI models only accept the default)
  #   max_chunk_chars      -> how much code goes into one request
  #   max_tokens           -> reply limit; reasoning models need room to think before answering
  #   params: {...}        -> extra API options, e.g. {reasoning_effort: low}
  teacher:
    provider: ${TEACHER_PROVIDER:-openai}
    model: ${TEACHER_MODEL}
    api_key_env: ${TEACHER_API_KEY_ENV:-OPENAI_API_KEY}
    base_url: ${TEACHER_BASE_URL:-}
    temperature: ${TEACHER_TEMPERATURE:-}
    max_chunk_chars: 20000
    max_tokens: 16000
  student:
    provider: ${STUDENT_PROVIDER:-openai}
    model: ${STUDENT_MODEL}
    api_key_env: ${STUDENT_API_KEY_ENV:-OPENAI_API_KEY}
    base_url: ${STUDENT_BASE_URL:-}
    temperature: ${STUDENT_TEMPERATURE:-}
    max_chunk_chars: 12000
    max_tokens: 8192
  student2:                       # optional second student: an open model on Groq's free tier
    provider: openai
    model: ${STUDENT2_MODEL:-openai/gpt-oss-20b}
    api_key_env: GROQ_API_KEY
    base_url: https://api.groq.com/openai/v1
    temperature: 0.0
    max_chunk_chars: 12000
    max_tokens: 8192              # gpt-oss replies use 2-5k tokens with reasoning; Groq's default 2048 is too small

scan:
  # How code is passed to the model:
  #   packed   - files packed together up to max_chunk_chars
  #   per_file - one file per request
  #   slices   - one request per manifest component: its file + app files it references
  strategy: slices
  slice_depth: 2                  # how many reference hops to follow from each component
  drop_unverified: true           # drop findings whose evidence quote isn't in the code

loop:
  students: [${STUDENTS:-student}]   # model keys above, e.g. STUDENTS=student,student2 in .env
  student_runs: ${STUDENT_RUNS:-1}   # repeat each student scan to measure variance
  placebo: true                   # also run each student with generic advice of the same length (control)
  max_lessons: 12

output_dir: runs

# Shared vocabulary for findings and ground truth. Matching is done on these keys.
categories:
  - hardcoded_secret
  - webview_untrusted_url
  - webview_insecure_settings
  - ssl_validation_bypass
  - intent_redirection
  - exported_component
  - implicit_intent
  - insecure_broadcast_receiver
  - content_provider_exposure
  - fileprovider_misconfig
  - arbitrary_file_theft
  - insecure_set_result
  - insecure_data_storage
  - insecure_logging
  - code_execution
  - vulnerable_dependency
  - cloud_misconfiguration
  - other
